<li class="grid cursor-pointer items-center gap-2 rounded-lg px-3 py-3 text-sm text-white transition hover:bg-white/10
         grid-cols-[12px_5.5rem_1fr_0.5fr_auto]
         sm:grid-cols-[18px_6rem_2fr_1fr_1fr] sm:gap-2.5 sm:px-4 sm:text-base" [class.bg-blue-500/20]="item().checked"
  (click)="toggle()">
  <span class="flex justify-center">
    @if (item().checked) {
    <fa-icon [icon]="faCheck" class="text-base text-green-400"></fa-icon>
    }
  </span>

  <span class="justify-self-start store truncate text-center text-white/80">{{ item().store || '—' }}</span>
  <span class="justify-self-center item min-w-0 wrap-break-word">{{ item().item }}</span>
  <span class="justify-self-center quantity whitespace-nowrap text-center">{{
    item().quantity
    }}</span>
  <span class="justify-self-end user whitespace-nowrap">{{ item().user }}</span>
</li>
