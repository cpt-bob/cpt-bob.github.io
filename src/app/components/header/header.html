<div class="mb-3 flex items-center justify-between">
  @if (auth.isLoggedIn()) {
  <p class="m-0 text-[#adff2f]">{{ auth.userName() }}</p>
  <p class="m-0 cursor-pointer text-white hover:text-[#ff8c00]" (click)="logout()">
    Logout
  </p>
  } @else {
  <p class="m-0 cursor-pointer text-white hover:text-[#ff8c00]" (click)="openLogin()">
    Login
  </p>
  <span></span>
  }
</div>

@if (showLogin()) {
<app-login (closed)="closeLogin()" />
}

<h2 class="mb-5 flex items-center justify-center gap-1 text-2xl font-bold text-white">
  Shopping List
  <img src="shopping-list.png" class="ml-1 w-7" alt="" />
</h2>
