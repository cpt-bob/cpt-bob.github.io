<div class="fixed inset-0 z-2000 flex items-center justify-center bg-black/85 p-4" (click)="onCancel()">
  <div class="w-full max-w-md rounded-2xl bg-linear-to-br from-[#5b548a] to-[#301934] p-6 text-white shadow-2xl"
    (click)="$event.stopPropagation()">
    <h3 class="mb-5 text-center text-2xl font-medium">Edit Item</h3>

    <div class="mb-4 flex items-center rounded-full bg-gray-200 pl-5">
      <select class="w-full appearance-none bg-transparent px-3 py-2.5 text-black outline-none" [ngModel]="store()"
        (ngModelChange)="store.set($event)">
        <option value="">Store (optional)</option>
        @for (s of stores; track s) {
        <option [value]="s">{{ s }}</option>
        }
      </select>
    </div>

    <div class="mb-4 flex items-center rounded-full bg-gray-200 pl-5">
      <input type="text" class="w-full bg-transparent px-3 py-2.5 text-black outline-none placeholder:text-gray-500"
        [ngModel]="itemName()" (ngModelChange)="itemName.set($event)" placeholder="Item name" autofocus />
    </div>

    <div class="mb-6 flex items-center rounded-full bg-gray-200 pl-5">
      <input type="text" class="w-full bg-transparent px-3 py-2.5 text-black outline-none placeholder:text-gray-500"
        [ngModel]="quantity()" (ngModelChange)="quantity.set($event)" placeholder="Quantity" />
    </div>

    <div class="flex flex-col gap-3 sm:flex-row sm:justify-center">
      <button type="button"
        class="rounded-full bg-blue-600 px-6 py-3 text-white transition hover:bg-blue-700 disabled:cursor-not-allowed disabled:opacity-60"
        (click)="onSave()" [disabled]="saving() || !itemName().trim() || !quantity().trim()">
        {{ saving() ? 'Saving...' : 'Save' }}
      </button>

      <button type="button" class="rounded-full bg-gray-600 px-6 py-3 text-white transition hover:bg-gray-500"
        (click)="onCancel()">
        Cancel
      </button>
    </div>
  </div>
</div>
